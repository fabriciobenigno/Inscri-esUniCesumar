<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>Inscrição Curso</title>
<link rel="icon" type="image/x-icon" href="simbolo.ico?v=1">
<link rel="shortcut icon" href="tata.png?v=1">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Roboto',sans-serif}
html,body{height:100%}
body{
  background:linear-gradient(135deg,#004aad,#007bff);
  display:flex;justify-content:center;align-items:center;
  padding:20px;overflow:auto;
  scroll-behavior:smooth;
  padding-top: env(safe-area-inset-top);
}

/* Splash */
#splash{position:fixed;inset:0;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity .6s}
#splash img{width:350px;margin-bottom:20px}
#splash p{color:#004aad;font-size:1.25rem;font-weight:500}

/* App */
#app{display:flex;flex-direction:row;background:#fff;border-radius:14px;box-shadow:0 12px 30px rgba(0,0,0,.18);max-width:1000px;width:100%;overflow:hidden;opacity:0;transform:scale(.98);transition:.5s}

/* Tutor */
#tutor{flex:0 0 380px;padding:28px 22px;display:flex;flex-direction:column;align-items:center;background:#f6f9ff}
#tutor #logo-tutor{width:330px;margin-bottom:14px}
#tutor img.tutor-photo{width:200px;height:200px;border-radius:50%;margin-bottom:14px;object-fit:cover}
.tutor-name{color:#004aad;font-size:1.45rem;font-weight:700;text-align:center}
.tutor-role{color:#333;font-size:1rem;text-align:center;margin-bottom:16px}

/* Contact */
.contact-list{display:flex;flex-direction:column;gap:10px}
.contact-btn{display:flex;align-items:center;gap:10px;justify-content:center;background:#fff;border-radius:8px;padding:10px 14px;color:#004aad;text-decoration:none;font-weight:600;box-shadow:0 6px 14px rgba(0,0,0,0.06);width:160px;transition:.2s}
.contact-btn img{width:32px;height:32px}
.contact-btn:hover{transform:translateY(-4px);background:#007bff;color:#fff}
.contact-btn:hover img{filter:brightness(0) invert(1)}

/* Form */
#form-container{flex:1;padding:28px 30px;display:flex;flex-direction:column;justify-content:center}
#form-container h1{color:#004aad;font-size:1.9rem;margin-bottom:12px}
form{display:flex;flex-direction:column;gap:10px}
input{
  width:100%;padding:12px;border-radius:8px;border:1px solid #d0d6e0;font-size:1rem
}
input:focus{outline:none;border-color:#007bff;box-shadow:0 4px 14px rgba(0,123,255,0.08)}

.btn{background:#007bff;color:#fff;border:none;padding:12px;border-radius:8px;font-weight:700;cursor:pointer}
.btn:hover{background:#0056b3}

/* Congrats */
#congrats{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:9998}
#congrats video{position:absolute;width:100%;height:100%;object-fit:cover}
#congrats-card{position:relative;background:rgba(255,255,255,0.9);padding:36px;border-radius:14px;text-align:center;max-width:520px}
#congrats-card h2{color:#004aad;margin-bottom:10px}

@media (max-width:1024px){
  #app{flex-direction:column}
}
</style>
</head>
<body>

<div id="splash">
  <img src="tata.png">
  <p>Carregando...</p>
</div>

<div id="app" style="display:none">

<aside id="tutor">
  <img id="logo-tutor" src="tata.png">
  <img class="tutor-photo" src="fabricio-benigno.jpg">
  <div class="tutor-name">Fabricio Benigno</div>
  <div class="tutor-role">Tutor e Orientador</div>

  <div class="contact-list">
    <a class="contact-btn" href="https://wa.me/5585921695620" target="_blank">
      <img src="whatsapp.ico"> WhatsApp
    </a>
    <a class="contact-btn" href="https://instagram.com/fabricio_benigno" target="_blank">
      <img src="instagram.ico"> Instagram
    </a>
  </div>
</aside>

<section id="form-container">
  <h1>Cadastro de Inscrição</h1>
  <form onsubmit="handleSubmit(event)">
    <input id="nome" type="text" placeholder="Nome Completo" required>
    <input id="telefone" type="tel" placeholder="Número" required>
    <input id="cpf" type="text" placeholder="CPF" required>
    <input id="email" type="email" placeholder="Email" required>
    <input id="nascimento" type="text" placeholder="Data de Nascimento (dd/mm/aaaa)" required>
    <input id="endereco" type="text" placeholder="Endereço" required>
    <input id="cep" type="text" placeholder="CEP" required>
    <input id="curso" type="text" placeholder="Curso de Interesse" required>
    <button type="submit" class="btn">Enviar Inscrição</button>
  </form>
</section>
</div>

<div id="congrats">
  <video autoplay muted loop>
    <source src="confetes.mp4" type="video/mp4">
  </video>
  <div id="congrats-card">
    <h2 id="congrats-title"></h2>
    <p>Estarei aqui para te auxiliar em sua jornada acadêmica.</p>
  </div>
</div>

<script>
const WEB_APP_URL="https://script.google.com/macros/s/AKfycbwSppBi7nRh82pEgw8ncmhx9noIly0tQFC1wNYVJuBCyv2gpu05nr7QKQqt5hfF-7sD/exec";

window.addEventListener("load",()=>{
  setTimeout(()=>{
    document.getElementById("splash").style.display="none";
    const app=document.getElementById("app");
    app.style.display="flex";
    app.style.opacity=1;
  },1200);
});

async function handleSubmit(e){
  e.preventDefault();
  const payload={
    nome:nome.value,
    telefone:telefone.value,
    cpf:cpf.value,
    email:email.value,
    nascimento:nascimento.value,
    endereco:endereco.value,
    cep:cep.value,
    areaInteresse:curso.value
  };

  await fetch(WEB_APP_URL,{method:"POST",mode:"no-cors",body:JSON.stringify(payload)});
  document.querySelector("form").reset();
  showCongrats(payload.nome);
}

function showCongrats(nomeCompleto){
  const [primeiro,segundo]=nomeCompleto.split(" ");
  document.getElementById("congrats-title").textContent=`Parabéns ${primeiro} ${segundo||""}!`;
  document.getElementById("congrats").style.display="flex";
}
</script>

</body>
</html>
